[project]
name = "youtrack-tests"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=9.2.0",
    "pytest-playwright>=0.10.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra"
base_url = "http://localhost:8080"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]